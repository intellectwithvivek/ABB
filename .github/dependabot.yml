# Weekly pull requests that keep dependencies current; CI (ci.yml) tests each one before it can be merged.
# Major versions are ignored: the project is pinned to .NET 8 (LTS) and Angular 21, and a major upgrade
# (framework, TypeScript, test runner) is a deliberate change made together with its migrations.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Angular packages are released together and must stay on the same version.
      angular:
        patterns: ["@angular/*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
