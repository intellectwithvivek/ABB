# Builds and tests the backend and the frontend on every push and pull request to main, and checks that the API's
# Docker image still builds once the backend passes. Render deploys the API only after all checks pass (render.yaml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # The SDK that backend/global.json selects, so CI and local builds use the same SDK line.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run test:ci
      - run: npm run format:check

  docker:
    name: Docker image (API)
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build only, nothing is pushed: proves backend/Dockerfile still produces the image Render deploys.
      - name: Build the API image
        run: docker build --file backend/Dockerfile --tag tictactoe-api backend
