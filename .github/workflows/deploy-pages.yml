# Publishes the frontend (game + docs portal) to GitHub Pages: https://intellectwithvivek.github.io/ABB/
# Pages serves static files only; the app calls the API hosted on Render (render.yaml).
# One-time setup: repository Settings > Pages > Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Optional: the repository variable API_BASE_URL (e.g. https://my-api.example.com/api, no trailing slash)
      # points the site at another API host without a code change. The value is passed as an environment
      # variable instead of being written into the script, so it can never run as shell code.
      - name: Point the site at the API_BASE_URL repository variable
        if: vars.API_BASE_URL != ''
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          cat > src/environments/environment.github-pages.ts <<EOF
          import { AppConfig } from '../app/core/config/app-config';

          export const environment: AppConfig = {
            apiBaseUrl: '${API_BASE_URL}',
            swaggerUrl: '${API_BASE_URL%/api}/swagger',
            repositoryUrl: '${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}',
          };
          EOF

      # npm run build (not ng build directly) so the prebuild step copies README.md and docs/ into the site.
      - run: npm run build -- --configuration github-pages

      # Pages has no single-page-app fallback: it answers unknown paths such as /ABB/docs/api with 404.html.
      # A copy of index.html there lets the Angular router open deep links.
      - run: cp dist/tictactoe-web/browser/index.html dist/tictactoe-web/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist/tictactoe-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages proves its identity to GitHub Pages with a short-lived OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
