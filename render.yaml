# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# Render dashboard > New > Blueprint > this repository. Render builds backend/Dockerfile and serves the API at
# https://tictactoe-abb-api.onrender.com (the service name becomes the subdomain).
services:
  - type: web
    name: tictactoe-abb-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # Deploy a commit only after its GitHub checks (ci.yml) pass, so a failing build never goes live.
    autoDeployTrigger: checksPass
    # Only backend changes rebuild the API. Every deploy restarts the service and clears the games held in memory.
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Browser origins allowed to call the API cross-origin: scheme + host only, no /ABB path.
      - key: Cors__AllowedOrigins__0
        value: https://intellectwithvivek.github.io
      # Optional second origin (e.g. https://<project>.vercel.app); Render asks for it when the Blueprint is created.
      # The Vercel deployment does not need it: its /api rewrite keeps the browser on the page's own origin.
      - key: Cors__AllowedOrigins__1
        sync: false
