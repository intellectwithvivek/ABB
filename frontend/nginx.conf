# Serves the Angular build and forwards API traffic to the "api" service (docker-compose.yml),
# so the browser talks to one origin and needs no CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/javascript application/json image/svg+xml;

    # ^~ stops nginx from also trying the regex (static file) locations below for these paths.
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /swagger {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Project docs published by the build. A missing file must stay a 404 (not the SPA fallback) so
    # the docs viewer can show its "not available" state. nginx has no MIME type for .md.
    # The names carry no hash, so browsers revalidate them (cheap 304s) and see a redeploy at once.
    location ^~ /content/ {
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Angular puts a content hash in bundle names (main-ABCD1234.js), so a changed file gets a new
    # name and the old one can be cached for a year. Case-sensitive (~, not ~*) because the hash is
    # upper case, so a plain name such as logo-original.svg is not mistaken for a hashed one.
    location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current bundles, so browsers must revalidate it on every visit.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/play, /docs/api) have no file on disk: serve the app and let the router
    # decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
